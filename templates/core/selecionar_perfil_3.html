<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selecionar Perfil</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/fundo.css' %}">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { background:rgba(255,255,255,0.95); backdrop-filter:blur(10px); border-radius:32px; padding:40px; max-width:550px; width:100%; text-align:center; }
    .logo { width:80px; margin-bottom:20px; }
    h2 { font-size:28px; color:#5C3A21; margin-bottom:8px; }
    p { color:#8B694C; margin-bottom:30px; }
    .opcoes { display:flex; flex-direction:column; gap:15px; margin-bottom:25px; }
    .btn-perfil { display:flex; align-items:center; gap:15px; padding:18px 20px; border:2px solid #F5EDDA; border-radius:20px; background:white; cursor:pointer; width:100%; text-align:left; transition:0.3s; }
    .btn-perfil:hover { border-color:#2B7A4B; transform:translateX(5px); background:#FBF7E9; }
    .icon { width:50px; height:50px; border-radius:15px; display:flex; align-items:center; justify-content:center; font-size:24px; color:white; }
    .icon-professor { background:linear-gradient(135deg,#D4A373,#B5835A); }
    .icon-diretor { background:linear-gradient(135deg,#2B7A4B,#1E5A38); }
    .icon-coordenador { background:linear-gradient(135deg,#5C3A21,#7A5233); }
    .info { flex:1; }
    .info h3 { font-size:18px; color:#5C3A21; margin-bottom:4px; }
    .info p { font-size:12px; color:#8B694C; margin:0; }
    .arrow { color:#D4A373; font-size:18px; }
    .btn-voltar { background:none; border:1px solid #F5EDDA; padding:12px; border-radius:30px; width:100%; cursor:pointer; color:#5C3A21; }
    @media (max-width:500px){ .card { padding:25px; } .btn-perfil { padding:12px 15px; } .icon { width:40px; height:40px; font-size:18px; } }
  </style>
</head>
<body>
  <div class="card">
    <img src="{% static 'images/logo-caf.png' %}" class="logo">
    <h2>Selecionar Perfil</h2>
    <p>Você possui múltiplos acessos. Escolha um perfil:</p>

    <form method="POST">
      {% csrf_token %}
      
      <div class="opcoes">
        <button type="submit" name="perfil" value="professor" class="btn-perfil">
          <div class="icon icon-professor"><i class="fas fa-chalkboard-user"></i></div>
          <div class="info"><h3>Entrar como Professor</h3><p>Acesso ao painel de aulas</p></div>
          <div class="arrow"><i class="fas fa-chevron-right"></i></div>
        </button>

        <button type="submit" name="perfil" value="diretor" class="btn-perfil">
          <div class="icon icon-diretor"><i class="fas fa-users"></i></div>
          <div class="info"><h3>Entrar como Diretor de Turma</h3><p>Distribuir pontos</p></div>
          <div class="arrow"><i class="fas fa-chevron-right"></i></div>
        </button>

        <button type="submit" name="perfil" value="coordenador" class="btn-perfil">
          <div class="icon icon-coordenador"><i class="fas fa-calendar-alt"></i></div>
          <div class="info"><h3>Entrar como Coordenador</h3><p>Criar atividades</p></div>
          <div class="arrow"><i class="fas fa-chevron-right"></i></div>
        </button>
      </div>
    </form>

    <button class="btn-voltar" onclick="window.location.href='/professor/login/'">Voltar</button>
  </div>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</body>
</html>
