<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colégio Árvore da Felicidade - Diretor de Turma</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/fundo.css' %}">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:#FBF7E9; }
    .dashboard-container { max-width:1400px; margin:0 auto; padding:20px; }
    .header { background:white; border-radius:24px; padding:15px 25px; margin-bottom:25px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; border:1px solid #F5EDDA; }
    .logo-area { display:flex; align-items:center; gap:12px; }
    .logo-icon { width:45px; height:45px; background:#2B7A4B; border-radius:12px; display:flex; align-items:center; justify-content:center; }
    .user-area { display:flex; align-items:center; gap:15px; background:#FBF7E9; padding:6px 18px; border-radius:40px; }
    .user-avatar { width:38px; height:38px; background:#2B7A4B; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; }
    .logout-btn { background:none; border:1px solid #F5EDDA; padding:6px 14px; border-radius:30px; cursor:pointer; }
    .dashboard-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:25px; }
    .card { background:white; border-radius:20px; padding:20px; border:1px solid #F5EDDA; }
    .card-header { margin-bottom:15px; padding-bottom:12px; border-bottom:2px solid #FBF7E9; }
    .card-header h3 { font-size:18px; color:#5C3A21; }
    .info-box { background:#FBF7E9; border-radius:16px; padding:15px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; }
    .pontos-disponiveis { font-size:32px; font-weight:800; color:#2B7A4B; }
    .form-group { margin-bottom:15px; }
    .form-group label { display:block; margin-bottom:5px; font-weight:600; color:#5C3A21; font-size:13px; }
    .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px; border:1px solid #F5EDDA; border-radius:12px; }
    .btn-primary { background:#2B7A4B; color:white; border:none; padding:10px 20px; border-radius:30px; cursor:pointer; width:100%; }
    .btn-primary:hover { background:#1E5A38; }
    .aluno-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #F5EDDA; flex-wrap:wrap; gap:10px; }
    .aluno-nome { font-weight:600; color:#5C3A21; }
    .aluno-pontos { background:#E9F5EF; padding:4px 10px; border-radius:20px; font-size:12px; color:#2B7A4B; }
    .btn-individual { background:#D4A373; border:none; padding:5px 12px; border-radius:20px; color:white; cursor:pointer; }
    .distribuir-input { width:70px; padding:5px; border:1px solid #F5EDDA; border-radius:10px; text-align:center; }
    .historico-item { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #F5EDDA; }
    @media (max-width:900px){ .dashboard-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="header"><div class="logo-area"><div class="logo-icon"><img src="{% static 'images/logo-caf.png' %}" style="width:28px"></div><h1>Colégio Árvore da Felicidade</h1></div><div class="user-area"><div class="user-avatar"><i class="fas fa-users"></i></div><div><div class="user-name">Diretor de Turma</div><div class="user-info">12ª EA - Eletrónica</div></div><button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sair</button></div></div>
    <div class="dashboard-grid">
      <div class="card"><div class="card-header"><h3><i class="fas fa-hand-holding-heart"></i> Distribuir Pontos</h3></div><div class="info-box"><div><strong>Pontos da Turma</strong><br>Disponíveis</div><div class="pontos-disponiveis" id="pontosDisponiveis">1.250</div></div>
        <div class="form-group"><label>Atividade</label><select id="atividadeSelect"><option value="">Selecione...</option><option value="Campeonato de Futsal">🏆 Campeonato de Futsal</option><option value="Feira de Ciências">🔬 Feira de Ciências</option><option value="Workshop de Robótica">🤖 Workshop de Robótica</option></select></div>
        <div class="form-group"><label>Total de Pontos</label><input type="number" id="totalPontos" value="500"></div>
        <div class="form-group"><label>Tipo</label><select id="tipoDistribuicao"><option value="igual">Distribuir igualmente</option><option value="personalizado">Distribuir manualmente</option></select></div>
        <button class="btn-primary" id="btnDistribuirMassa"><i class="fas fa-share-alt"></i> Distribuir Pontos</button>
        <div style="margin-top:20px;"><h4><i class="fas fa-user-edit"></i> Distribuição Personalizada</h4></div>
        <div id="alunosList"></div>
      </div>
      <div class="card"><div class="card-header"><h3><i class="fas fa-history"></i> Histórico</h3></div><div id="historicoList"></div></div>
    </div>
  </div>
  <div id="infoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:1000;"><div style="background:white; border-radius:24px; padding:30px; max-width:350px; text-align:center;"><div style="width:60px; height:60px; background:#2B7A4B; border-radius:50%; margin:0 auto 15px; display:flex; align-items:center; justify-content:center;"><i id="modalIcon" class="fas fa-check-circle" style="font-size:30px; color:white;"></i></div><h3 id="modalTitle">Sucesso!</h3><p id="modalMessage"></p><button id="modalCloseBtn" style="background:#2B7A4B; color:white; border:none; padding:10px 20px; border-radius:30px; cursor:pointer;">Continuar</button></div></div>
  <script>
    let alunos = [{ id:1, nome:"Ricardo Oliveira", processo:"20230814", pontos:2450 },{ id:2, nome:"João Silva", processo:"20241122", pontos:3200 },{ id:3, nome:"Maria Santos", processo:"20241001", pontos:1890 }];
    let pontosTurma = 1250, historico = [];
    function showModal(title, msg, isSuccess=true) { document.getElementById('modalTitle').innerText = title; document.getElementById('modalMessage').innerText = msg; const icon = document.querySelector('#infoModal .modal-icon'); icon.style.background = isSuccess ? '#2B7A4B' : '#D4A373'; document.getElementById('infoModal').style.display = 'flex'; }
    function hideModal() { document.getElementById('infoModal').style.display = 'none'; }
    function atualizarPontos() { document.getElementById('pontosDisponiveis').innerText = pontosTurma; }
    function renderAlunos() { document.getElementById('alunosList').innerHTML = alunos.map(a => `<div class="aluno-item" data-id="${a.id}"><div><div class="aluno-nome">${a.nome}</div><div class="aluno-processo">${a.processo}</div></div><div><span class="aluno-pontos">${a.pontos} pts</span><input type="number" id="pts-${a.id}" class="distribuir-input" value="10"><button class="btn-individual" onclick="distribuirIndividual(${a.id}, '${a.nome}')"><i class="fas fa-plus"></i> Distribuir</button></div></div>`).join(''); }
    function renderHistorico() { document.getElementById('historicoList').innerHTML = historico.map(h => `<div class="historico-item"><div><strong>${h.atividade}</strong><br><small>${h.data} • ${h.alunos} alunos</small></div><div style="color:#2B7A4B;">+${h.pontos} pts</div></div>`).join(''); }
    window.distribuirIndividual = (id, nome) => { let pontos = parseInt(document.getElementById(`pts-${id}`).value); let atividade = document.getElementById('atividadeSelect').value; if(!atividade) { showModal('⚠️ Atenção', 'Selecione uma atividade!', false); return; } if(pontosTurma < pontos) { showModal('❌ Saldo Insuficiente', `Apenas ${pontosTurma} pontos!`, false); return; } let aluno = alunos.find(a => a.id === id); pontosTurma -= pontos; aluno.pontos += pontos; historico.unshift({ atividade, data: new Date().toLocaleDateString('pt-BR'), pontos, alunos:1 }); atualizarPontos(); renderAlunos(); renderHistorico(); showModal('✅ Sucesso!', `${pontos} pontos para ${nome}.`); };
    document.getElementById('btnDistribuirMassa').addEventListener('click', () => { let atividade = document.getElementById('atividadeSelect').value, total = parseInt(document.getElementById('totalPontos').value), tipo = document.getElementById('tipoDistribuicao').value; if(!atividade) { showModal('⚠️ Atenção', 'Selecione uma atividade!', false); return; } if(total > pontosTurma) { showModal('❌ Saldo Insuficiente', `Apenas ${pontosTurma} pontos!`, false); return; } if(tipo === 'igual') { let porAluno = Math.floor(total / alunos.length); pontosTurma -= total; alunos.forEach(a => a.pontos += porAluno); historico.unshift({ atividade, data: new Date().toLocaleDateString('pt-BR'), pontos: total, alunos: alunos.length }); atualizarPontos(); renderAlunos(); renderHistorico(); showModal('✅ Sucesso!', `${total} pontos divididos entre ${alunos.length} alunos.`); } else { showModal('ℹ️ Aviso', 'Use os botões individuais.', true); } });
    document.getElementById('logoutBtn').addEventListener('click', () => window.location.href = '/');
    document.getElementById('modalCloseBtn').addEventListener('click', hideModal);
    renderAlunos(); renderHistorico(); atualizarPontos();
  </script>
</body>
</html>
