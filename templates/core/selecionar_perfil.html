<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecionar Perfil - Colégio Árvore da Felicidade</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/fundo.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; padding: 20px; min-height: 100vh; }
        .container { max-width: 550px; width: 100%; }
        .perfil-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px;
            text-align: center;
        }
        .perfil-logo { width: 80px; height: 80px; margin-bottom: 20px; }
        .perfil-card h2 { font-size: 28px; color: #5C3A21; margin-bottom: 8px; }
        .perfil-card p { color: #8B694C; margin-bottom: 30px; }
        .opcoes { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .btn-perfil {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px 20px;
            border: 2px solid #F5EDDA;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-perfil:hover { border-color: #2B7A4B; transform: translateX(5px); background: #FBF7E9; }
        .perfil-icon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .icon-professor { background: linear-gradient(135deg, #D4A373, #B5835A); }
        .icon-diretor { background: linear-gradient(135deg, #2B7A4B, #1E5A38); }
        .icon-coordenador { background: linear-gradient(135deg, #5C3A21, #7A5233); }
        .perfil-info { flex: 1; text-align: left; }
        .perfil-info h3 { font-size: 18px; color: #5C3A21; margin-bottom: 4px; }
        .perfil-info p { font-size: 12px; color: #8B694C; margin: 0; }
        .perfil-arrow { color: #D4A373; font-size: 18px; }
        @media (max-width: 500px) {
            .perfil-card { padding: 25px; }
            .btn-perfil { padding: 12px 15px; }
            .perfil-icon { width: 40px; height: 40px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="perfil-card">
            <img src="{% static 'images/logo-caf.png' %}" class="perfil-logo">
            <h2>Selecionar Perfil</h2>
            <p>Escolha o tipo de acesso desejado</p>
            <div class="opcoes" id="opcoesContainer">
                {% if tem_professor %}
                <button class="btn-perfil" data-perfil="professor">
                    <div class="perfil-icon icon-professor"><i class="fas fa-chalkboard-user"></i></div>
                    <div class="perfil-info"><h3>Entrar como Professor</h3><p>Acesso ao painel de aulas</p></div>
                    <div class="perfil-arrow"><i class="fas fa-chevron-right"></i></div>
                </button>
                {% endif %}
                {% if tem_coordenador_cultural %}
                <button class="btn-perfil" data-perfil="coordenador_cultural">
                    <div class="perfil-icon icon-coordenador"><i class="fas fa-palette"></i></div>
                    <div class="perfil-info"><h3>Entrar como Coordenador Cultural</h3><p>Criar actividades culturais</p></div>
                    <div class="perfil-arrow"><i class="fas fa-chevron-right"></i></div>
                </button>
                {% endif %}
                {% if tem_coordenador_ciencia %}
                <button class="btn-perfil" data-perfil="coordenador_ciencia">
                    <div class="perfil-icon icon-coordenador"><i class="fas fa-flask"></i></div>
                    <div class="perfil-info"><h3>Entrar como Coordenador Ciência</h3><p>Criar actividades científicas</p></div>
                    <div class="perfil-arrow"><i class="fas fa-chevron-right"></i></div>
                </button>
                {% endif %}
                {% if tem_diretor %}
                <button class="btn-perfil" data-perfil="diretor_turma">
                    <div class="perfil-icon icon-diretor"><i class="fas fa-users"></i></div>
                    <div class="perfil-info"><h3>Entrar como Diretor de Turma</h3><p>Distribuir pontos</p></div>
                    <div class="perfil-arrow"><i class="fas fa-chevron-right"></i></div>
                </button>
                {% endif %}
            </div>
        </div>
    </div>
    
    <div id="infoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(92,58,33,0.6); align-items:center; justify-content:center; z-index:1000;">
        <div style="background:white; border-radius:24px; padding:30px; max-width:350px; text-align:center;">
            <div style="width:60px; height:60px; background:#2B7A4B; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;">
                <i class="fas fa-spinner fa-pulse" style="font-size:30px; color:white;"></i>
            </div>
            <h3 id="modalTitle" style="color:#5C3A21;">Redirecionando</h3>
            <p id="modalMessage" style="color:#8B694C;">Aguarde...</p>
        </div>
    </div>
    
    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        const modal = document.getElementById('infoModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');

        function showModal(message) {
            modalTitle.textContent = 'Redirecionando';
            modalMessage.textContent = message;
            modal.style.display = 'flex';
        }

        function hideModal() { modal.style.display = 'none'; }

        document.querySelectorAll('.btn-perfil').forEach(btn => {
            btn.addEventListener('click', async () => {
                const perfil = btn.dataset.perfil;
                showModal(`Redirecionando para o painel de ${perfil}...`);
                try {
                    const response = await fetch('/api/professor/redirecionar/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                        body: JSON.stringify({ perfil: perfil })
                    });
                    const data = await response.json();
                    if (data.redirect) window.location.href = data.redirect;
                } catch (error) {
                    hideModal();
                    alert('Erro ao redirecionar');
                }
            });
        });
    </script>
</body>
</html>
