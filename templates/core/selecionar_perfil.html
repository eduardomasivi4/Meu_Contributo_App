<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colégio Árvore da Felicidade - Selecionar Perfil</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/fundo.css' %}">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; padding:20px; }
    .container { max-width:550px; width:100%; }
    .perfil-card { background:rgba(255,255,255,0.95); backdrop-filter:blur(10px); border-radius:32px; padding:40px; text-align:center; }
    .perfil-logo { width:80px; height:80px; margin-bottom:20px; }
    .perfil-card h2 { font-size:28px; color:#5C3A21; margin-bottom:8px; }
    .perfil-card p { color:#8B694C; margin-bottom:30px; }
    .opcoes { display:flex; flex-direction:column; gap:15px; margin-bottom:25px; }
    .btn-perfil { display:flex; align-items:center; gap:15px; padding:18px 20px; border:2px solid #F5EDDA; border-radius:20px; background:white; cursor:pointer; transition:0.3s; }
    .btn-perfil:hover { border-color:#2B7A4B; transform:translateX(5px); background:#FBF7E9; }
    .perfil-icon { width:50px; height:50px; border-radius:15px; display:flex; align-items:center; justify-content:center; font-size:24px; color:white; }
    .icon-professor { background:linear-gradient(135deg,#D4A373,#B5835A); }
    .icon-diretor { background:linear-gradient(135deg,#2B7A4B,#1E5A38); }
    .icon-coordenador { background:linear-gradient(135deg,#5C3A21,#7A5233); }
    .perfil-info { flex:1; text-align:left; }
    .perfil-info h3 { font-size:18px; color:#5C3A21; margin-bottom:4px; }
    .perfil-info p { font-size:12px; color:#8B694C; margin:0; }
    .perfil-arrow { color:#D4A373; font-size:18px; }
    .btn-voltar { background:none; border:1px solid #F5EDDA; padding:12px 20px; border-radius:40px; color:#5C3A21; cursor:pointer; width:100%; }
    @media (max-width:500px){ .perfil-card { padding:25px; } .btn-perfil { padding:12px 15px; } .perfil-icon { width:40px; height:40px; font-size:18px; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="perfil-card">
      <img src="{% static 'images/logo-caf.png' %}" class="perfil-logo">
      <h2>Selecionar Perfil</h2>
      <p>Escolha o tipo de acesso desejado</p>
      <div class="opcoes">
        <button class="btn-perfil" id="btnProfessor"><div class="perfil-icon icon-professor"><i class="fas fa-chalkboard-user"></i></div><div class="perfil-info"><h3>Entrar como Professor</h3><p>Acesso ao painel de aulas</p></div><div class="perfil-arrow"><i class="fas fa-chevron-right"></i></div></button>
        <button class="btn-perfil" id="btnDiretor"><div class="perfil-icon icon-diretor"><i class="fas fa-users"></i></div><div class="perfil-info"><h3>Entrar como Diretor de Turma</h3><p>Distribuir pontos</p></div><div class="perfil-arrow"><i class="fas fa-chevron-right"></i></div></button>
        <button class="btn-perfil" id="btnCoordenador"><div class="perfil-icon icon-coordenador"><i class="fas fa-calendar-alt"></i></div><div class="perfil-info"><h3>Entrar como Coordenador</h3><p>Criar atividades</p></div><div class="perfil-arrow"><i class="fas fa-chevron-right"></i></div></button>
      </div>
      <button class="btn-voltar" id="btnVoltar"><i class="fas fa-arrow-left"></i> Voltar</button>
    </div>
  </div>
  <div id="infoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:1000;"><div style="background:white; border-radius:24px; padding:30px; max-width:350px; text-align:center;"><div style="width:60px; height:60px; background:#2B7A4B; border-radius:50%; margin:0 auto 15px; display:flex; align-items:center; justify-content:center;"><i id="modalIcon" class="fas fa-check-circle" style="font-size:30px; color:white;"></i></div><h3 id="modalTitle">Acesso</h3><p id="modalMessage"></p><button id="modalCloseBtn" style="background:#2B7A4B; color:white; border:none; padding:10px 20px; border-radius:30px; cursor:pointer;">Continuar</button></div></div>
  <script>
    const btnProfessor = document.getElementById('btnProfessor'), btnDiretor = document.getElementById('btnDiretor'), btnCoordenador = document.getElementById('btnCoordenador'), btnVoltar = document.getElementById('btnVoltar'), modal = document.getElementById('infoModal'), modalTitle = document.getElementById('modalTitle'), modalMessage = document.getElementById('modalMessage'), modalIcon = document.getElementById('modalIcon'), modalCloseBtn = document.getElementById('modalCloseBtn');
    function showModal(title, msg, callback) { modalTitle.textContent = title; modalMessage.textContent = msg; modal.style.display = 'flex'; modal.dataset.callback = callback; }
    function hideModal() { modal.style.display = 'none'; const cb = modal.dataset.callback; if(cb) window.location.href = cb; }
    btnProfessor.addEventListener('click', () => showModal('👨‍🏫 Acesso Professor', 'Redirecionando...', '/professor/dashboard/'));
    btnDiretor.addEventListener('click', () => showModal('👔 Acesso Diretor', 'Redirecionando...', '/diretor/dashboard/'));
    btnCoordenador.addEventListener('click', () => showModal('📋 Acesso Coordenador', 'Redirecionando...', '/coordenador/dashboard/'));
    btnVoltar.addEventListener('click', () => window.location.href = '/');
    modalCloseBtn.addEventListener('click', hideModal);
  </script>
</body>
</html>
