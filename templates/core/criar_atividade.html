<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Atividade - Colégio Árvore da Felicidade</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/fundo.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #FBF7E9; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        .header {
            background: white;
            border-radius: 24px;
            padding: 15px 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #F5EDDA;
        }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 45px; height: 45px; background: #2B7A4B; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .logo-icon img { width: 28px; height: 28px; }
        .logo-area h1 { font-size: 18px; color: #5C3A21; font-weight: 700; }
        .back-link { background: #FBF7E9; border: none; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-size: 13px; color: #5C3A21; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .user-area { display: flex; align-items: center; gap: 15px; background: #FBF7E9; padding: 6px 18px; border-radius: 40px; }
        .user-avatar { width: 38px; height: 38px; background: #2B7A4B; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; }
        .user-name { font-weight: 600; color: #5C3A21; font-size: 14px; }
        .logout-btn { background: none; border: 1px solid #F5EDDA; padding: 6px 14px; border-radius: 30px; cursor: pointer; }

        .form-card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            border: 1px solid #F5EDDA;
        }
        .form-title {
            font-size: 24px;
            color: #5C3A21;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #FBF7E9;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #5C3A21; }
        .form-group label i { margin-right: 8px; color: #D4A373; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #F5EDDA;
            border-radius: 16px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #2B7A4B;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
        .radio-group label { display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer; }
        
        .turmas-multiplas { margin-top: 15px; padding: 15px; background: #FBF7E9; border-radius: 16px; display: none; }
        .turmas-multiplas.visible { display: block; }
        .turmas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
        .turmas-grid label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5C3A21; cursor: pointer; }
        
        .btn-submit {
            width: 100%;
            background: #2B7A4B;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        .btn-submit:hover { background: #1E5A38; transform: translateY(-2px); }
        
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .container { padding: 15px; }
            .form-card { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon"><img src="{% static 'images/logo-caf.png' %}" alt="Logo"></div>
                <h1>Colégio Árvore da Felicidade</h1>
            </div>
            <div>
                <a href="{% url 'turma_detail' turma.id %}?disciplina_id={{ disciplina.id }}" class="back-link"><i class="fas fa-arrow-left"></i> Voltar para Turma</a>
            </div>
            <div class="user-area">
                <div class="user-avatar"><i class="fas fa-chalkboard-user"></i></div>
                <div><div class="user-name">{{ request.user.get_full_name|default:request.user.username }}</div></div>
                <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sair</button>
            </div>
        </div>

        <div class="form-card">
            <h2 class="form-title"><i class="fas fa-plus-circle"></i> Criar Nova Atividade</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Nome da Atividade</label>
                    <input type="text" name="nome" required placeholder="Ex: Prova de Matemática">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-align-left"></i> Descrição</label>
                    <textarea name="descricao" rows="3" placeholder="Descreva a atividade..."></textarea>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-clipboard-list"></i> Critérios de Avaliação</label>
                    <textarea name="criterios" rows="3" required placeholder="Ex: Participação, Entrega no prazo, Qualidade do trabalho..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-calendar"></i> Data de Início</label>
                        <input type="date" name="data_inicio" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-calendar-check"></i> Data de Fim</label>
                        <input type="date" name="data_fim" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-clock"></i> Hora de Início</label>
                        <input type="time" name="hora_inicio" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-clock"></i> Hora de Fim</label>
                        <input type="time" name="hora_fim" required>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-star"></i> Máximo de Pontos por Aluno</label>
                    <input type="number" name="max_pontos" value="100" min="1" max="500" required>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-users"></i> Selecionar Turmas</label>
                    <div class="radio-group">
                        <label><input type="radio" name="tipo_turma" value="unica" checked> Apenas esta turma ({{ turma.nome }})</label>
                        <label><input type="radio" name="tipo_turma" value="multiplas"> Múltiplas turmas</label>
                    </div>
                </div>
                
                <div id="turmasMultiplas" class="turmas-multiplas">
                    <label><i class="fas fa-check-square"></i> Selecione as turmas:</label>
                    <div class="turmas-grid">
                        {% for t in todas_turmas %}
                        <label>
                            <input type="checkbox" name="turmas_multiplas" value="{{ t.id }}">
                            {{ t.nome }} - {{ t.get_curso_display }}
                        </label>
                        {% endfor %}
                    </div>
                </div>
                
                <button type="submit" class="btn-submit"><i class="fas fa-save"></i> Criar Atividade</button>
            </form>
        </div>
    </div>

    <script>
        document.querySelectorAll('input[name="tipo_turma"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const multiplasDiv = document.getElementById('turmasMultiplas');
                if (this.value === 'multiplas') {
                    multiplasDiv.classList.add('visible');
                } else {
                    multiplasDiv.classList.remove('visible');
                }
            });
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            window.location.href = "{% url 'index' %}";
        });
    </script>
</body>
</html>
