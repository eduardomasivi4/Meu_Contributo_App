<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colégio Árvore da Felicidade</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/fundo.css' %}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { max-width: 600px; width: 100%; }
    .hero-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 40px; padding: 60px 50px; text-align: center; box-shadow: 0 30px 50px rgba(0,0,0,0.2); }
    .logo-hero { width: 120px; height: 120px; margin-bottom: 25px; }
    .hero-card h1 { font-size: 36px; color: #5C3A21; margin-bottom: 12px; font-weight: 800; }
    .hero-card p { color: #8B694C; margin-bottom: 35px; font-size: 16px; }
    .btn-hero { background: #2B7A4B; color: white; border: none; padding: 18px 35px; border-radius: 60px; font-size: 18px; font-weight: 600; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-hero:hover { background: #1E5A38; transform: translateY(-3px); }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(92, 58, 33, 0.6); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: all 0.3s; }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-container { background: white; border-radius: 32px; padding: 40px; max-width: 380px; width: 90%; text-align: center; }
    .modal-icon { width: 70px; height: 70px; background: #2B7A4B; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    .modal-icon i { font-size: 35px; color: white; }
    .modal-container h3 { color: #5C3A21; font-size: 24px; margin-bottom: 10px; }
    .modal-container p { color: #8B694C; margin-bottom: 25px; }
    .btn-modal-primary { background: #2B7A4B; color: white; border: none; padding: 12px 24px; border-radius: 40px; cursor: pointer; width: 100%; font-weight: 600; }
    .opcoes { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
    .btn-opcao { background: #2B7A4B; color: white; border: none; padding: 14px; border-radius: 40px; cursor: pointer; font-weight: 600; font-size: 16px; }
    .btn-opcao:last-child { background: #D4A373; }
    @media (max-width: 550px) { .hero-card { padding: 40px 30px; } .hero-card h1 { font-size: 28px; } .logo-hero { width: 90px; height: 90px; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero-card">
      <img src="{% static 'images/logo-caf.png' %}" alt="Logo" class="logo-hero">
      <h1>Colégio Árvore<br>da Felicidade</h1>
      <p>Sistema de Gestão de Mérito Estudantil</p>
      <button class="btn-hero" id="btnEntrar"><i class="fas fa-arrow-right-to-bracket"></i> Entrar no Sistema <i class="fas fa-chevron-right"></i></button>
    </div>
  </div>
  <div id="tipoModal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-icon"><i class="fas fa-user-circle"></i></div>
      <h3>Escolha seu perfil</h3>
      <p>Selecione o tipo de acesso para continuar</p>
      <div class="opcoes"><button class="btn-opcao" id="btnAluno"><i class="fas fa-user-graduate"></i> Sou Aluno</button><button class="btn-opcao" id="btnProfessor"><i class="fas fa-chalkboard-user"></i> Sou Professor</button></div>
      <br>
      <button id="closeTipoModal" class="btn-modal-primary">Cancelar</button>
    </div>
  </div>
  <script>
    const btnEntrar = document.getElementById('btnEntrar'), tipoModal = document.getElementById('tipoModal'), btnAluno = document.getElementById('btnAluno'), btnProfessor = document.getElementById('btnProfessor'), closeTipoModal = document.getElementById('closeTipoModal');
    function showModal() { tipoModal.classList.add('active'); }
    function hideModal() { tipoModal.classList.remove('active'); }
    btnEntrar.addEventListener('click', showModal);
    btnAluno.addEventListener('click', () => { hideModal(); window.location.href = '/aluno/login/'; });
    btnProfessor.addEventListener('click', () => { hideModal(); window.location.href = '/professor/login/'; });
    closeTipoModal.addEventListener('click', hideModal);
    tipoModal.addEventListener('click', (e) => { if (e.target === tipoModal) hideModal(); });
  </script>
</body>
</html>
