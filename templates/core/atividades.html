<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colégio Árvore da Felicidade - Atividades</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/fundo.css' %}">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:#FBF7E9; }
    .container { max-width:1400px; margin:0 auto; padding:20px; }
    .header { background:white; border-radius:24px; padding:15px 25px; margin-bottom:25px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; border:1px solid #F5EDDA; }
    .logo-area { display:flex; align-items:center; gap:12px; }
    .logo-icon { width:45px; height:45px; background:#2B7A4B; border-radius:12px; display:flex; align-items:center; justify-content:center; }
    .nav-links { display:flex; gap:8px; }
    .nav-link { padding:8px 18px; text-decoration:none; color:#8B694C; font-weight:500; border-radius:10px; }
    .nav-link.active { background:#2B7A4B; color:white; }
    .user-area { display:flex; align-items:center; gap:15px; background:#FBF7E9; padding:6px 18px; border-radius:40px; }
    .user-avatar { width:38px; height:38px; background:#2B7A4B; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; }
    .categories-tabs { display:flex; gap:15px; margin-bottom:25px; flex-wrap:wrap; justify-content:center; }
    .category-btn { background:white; border:2px solid #F5EDDA; padding:10px 24px; border-radius:40px; font-weight:600; color:#8B694C; cursor:pointer; }
    .category-btn.active { background:#2B7A4B; border-color:#2B7A4B; color:white; }
    .atividades-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(350px,1fr)); gap:25px; }
    .atividade-card { background:white; border-radius:20px; overflow:hidden; cursor:pointer; border:1px solid #F5EDDA; transition:0.3s; }
    .atividade-card:hover { transform:translateY(-5px); box-shadow:0 10px 25px rgba(0,0,0,0.1); }
    .atividade-header { padding:20px 24px; color:white; }
    .atividade-header.ciencia { background:linear-gradient(135deg,#2B7A4B,#1E5A38); }
    .atividade-header.cultura { background:linear-gradient(135deg,#D4A373,#B5835A); }
    .atividade-categoria { display:inline-block; background:rgba(255,255,255,0.2); padding:4px 12px; border-radius:20px; font-size:11px; margin-bottom:10px; }
    .atividade-header h3 { font-size:18px; }
    .atividade-body { padding:20px; }
    .atividade-pontos { display:inline-block; background:#FBF7E9; padding:6px 14px; border-radius:20px; font-weight:700; color:#2B7A4B; margin-bottom:15px; }
    .requisitos-section { background:#f8f9fa; border-radius:16px; padding:15px; margin-bottom:15px; }
    .requisitos-lista { list-style:none; }
    .requisitos-lista li { font-size:13px; color:#8B694C; padding:6px 0; display:flex; align-items:center; gap:8px; }
    .requisitos-lista li i { color:#2B7A4B; }
    .atividade-footer { display:flex; justify-content:space-between; padding-top:15px; border-top:1px solid #F5EDDA; }
    .status-badge { padding:4px 12px; border-radius:20px; font-size:12px; }
    .status-disponivel { background:#FBF7E9; color:#2B7A4B; }
    .sem-atividades { text-align:center; padding:60px; color:#8B694C; }
    @media (max-width:768px){ .atividades-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-area"><div class="logo-icon"><img src="{% static 'images/logo-caf.png' %}" style="width:28px"></div><h1>Colégio Árvore da Felicidade</h1></div>
      <div class="nav-links"><a href="/aluno/dashboard/" class="nav-link"><i class="fas fa-home"></i> Início</a><a href="#" class="nav-link active"><i class="fas fa-calendar-alt"></i> Atividades</a><a href="/aluno/loja/" class="nav-link"><i class="fas fa-store"></i> Loja</a></div>
      <div class="user-area"><div class="user-avatar"><i class="fas fa-user-graduate"></i></div><div><div class="user-name">Ricardo Oliveira</div><div class="user-info">PROC: #20230814 | 12° B</div></div><button class="logout-btn" id="logoutBtn" style="background:none; border:1px solid #F5EDDA; padding:6px 14px; border-radius:30px; cursor:pointer;"><i class="fas fa-sign-out-alt"></i> Sair</button></div>
    </div>
    <div class="categories-tabs"><button class="category-btn active" data-categoria="todas"><i class="fas fa-th-large"></i> Todas</button><button class="category-btn" data-categoria="ciencia"><i class="fas fa-flask"></i> Ciência</button><button class="category-btn" data-categoria="cultura"><i class="fas fa-palette"></i> Culturais</button></div>
    <div id="atividadesGrid" class="atividades-grid"></div>
  </div>
  <div id="infoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:1000;"><div style="background:white; border-radius:24px; padding:30px; max-width:350px; text-align:center;"><div style="width:60px; height:60px; background:#2B7A4B; border-radius:50%; margin:0 auto 15px; display:flex; align-items:center; justify-content:center;"><i id="modalIcon" class="fas fa-info-circle" style="font-size:30px; color:white;"></i></div><h3 id="modalTitle">Detalhes</h3><p id="modalMessage"></p><button id="modalCloseBtn" style="background:#2B7A4B; color:white; border:none; padding:10px 20px; border-radius:30px; cursor:pointer;">Fechar</button></div></div>
  <script>
    const atividades = [{ id:1, nome:"Workshop de Robótica", categoria:"ciencia", requisitos:["Conhecimentos básicos","4 sessões","Trabalho em equipe"], pontos:200, status:"disponivel", data:"Novembro 2023" },{ id:2, nome:"Feira de Ciências", categoria:"ciencia", requisitos:["Desenvolver protótipo","Apresentação oral","Relatório"], pontos:300, status:"disponivel", data:"Dezembro 2023" },{ id:3, nome:"Oficina de Teatro", categoria:"cultura", requisitos:["Disponibilidade ensaios","Apresentação final","Criar cena"], pontos:180, status:"disponivel", data:"Novembro 2023" }];
    let categoriaAtiva = 'todas';
    const modal = document.getElementById('infoModal'), modalTitle = document.getElementById('modalTitle'), modalMessage = document.getElementById('modalMessage'), modalIcon = document.getElementById('modalIcon'), modalCloseBtn = document.getElementById('modalCloseBtn');
    function showModal(title, msg) { modalTitle.textContent = title; modalMessage.textContent = msg; modal.style.display = 'flex'; }
    function hideModal() { modal.style.display = 'none'; }
    function render() {
      let filtered = categoriaAtiva === 'todas' ? [...atividades] : atividades.filter(a => a.categoria === categoriaAtiva);
      const grid = document.getElementById('atividadesGrid');
      if(filtered.length === 0) { grid.innerHTML = '<div class="sem-atividades"><i class="fas fa-calendar-times"></i><h3>Nenhuma atividade</h3></div>'; return; }
      grid.innerHTML = filtered.map(a => `<div class="atividade-card" data-id="${a.id}"><div class="atividade-header ${a.categoria === 'ciencia' ? 'ciencia' : 'cultura'}"><div class="atividade-categoria">${a.categoria === 'ciencia' ? '🔬 Ciência' : '🎭 Cultura'}</div><h3>${a.nome}</h3></div><div class="atividade-body"><div class="requisitos-section"><strong><i class="fas fa-clipboard-list"></i> Critérios:</strong><ul class="requisitos-lista">${a.requisitos.map(r => `<li><i class="fas fa-check-circle"></i> ${r}</li>`).join('')}</ul></div><div class="atividade-pontos"><i class="fas fa-star"></i> ${a.pontos} pontos</div><div class="atividade-footer"><span class="status-badge status-disponivel"><i class="fas fa-calendar-check"></i> Disponível</span><span><i class="fas fa-calendar"></i> ${a.data}</span></div></div></div>`).join('');
      document.querySelectorAll('.atividade-card').forEach(card => { card.addEventListener('click', () => { const id = parseInt(card.dataset.id); const a = atividades.find(x => x.id === id); showModal(`📋 ${a.nome}`, `Pontuação: ${a.pontos} pts\n\nRequisitos:\n${a.requisitos.map(r => `• ${r}`).join('\n')}`); }); });
    }
    document.querySelectorAll('.category-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); categoriaAtiva = btn.dataset.categoria; render(); }); });
    document.getElementById('logoutBtn').addEventListener('click', () => { window.location.href = '/'; });
    modalCloseBtn.addEventListener('click', hideModal);
    render();
  </script>
</body>
</html>
