<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colégio Árvore da Felicidade - Atividades</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/fundo.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #FBF7E9; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        .header {
            background: white;
            border-radius: 24px;
            padding: 15px 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #F5EDDA;
        }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 45px; height: 45px; background: #2B7A4B; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .logo-icon img { width: 28px; height: 28px; }
        .logo-area h1 { font-size: 18px; color: #5C3A21; font-weight: 700; }
        .nav-links { display: flex; gap: 8px; }
        .nav-link { padding: 8px 18px; text-decoration: none; color: #8B694C; font-weight: 500; border-radius: 10px; font-size: 14px; }
        .nav-link:hover { background: #FBF7E9; color: #5C3A21; }
        .nav-link.active { background: #2B7A4B; color: white; }
        .user-area { display: flex; align-items: center; gap: 15px; background: #FBF7E9; padding: 6px 18px; border-radius: 40px; }
        .user-avatar { width: 38px; height: 38px; background: #2B7A4B; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; }
        .user-name { font-weight: 600; color: #5C3A21; font-size: 14px; }
        .user-info { font-size: 11px; color: #8B694C; }
        .saldo-card { background: #2B7A4B; padding: 6px 16px; border-radius: 30px; color: white; font-size: 14px; font-weight: 600; }
        .logout-btn { background: none; border: 1px solid #F5EDDA; padding: 6px 14px; border-radius: 30px; cursor: pointer; }

        /* Filtros principais */
        .main-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: center;
        }
        .main-tab {
            background: white;
            border: 2px solid #F5EDDA;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 600;
            color: #8B694C;
            cursor: pointer;
            transition: all 0.3s;
        }
        .main-tab.active {
            background: #2B7A4B;
            border-color: #2B7A4B;
            color: white;
        }
        .main-tab:hover:not(.active) {
            border-color: #2B7A4B;
            color: #2B7A4B;
        }

        /* Sub-filtros */
        .sub-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 10px;
            background: white;
            border-radius: 50px;
            border: 1px solid #F5EDDA;
        }
        .sub-filter-btn {
            background: #FBF7E9;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 500;
            color: #8B694C;
            cursor: pointer;
            transition: all 0.3s;
        }
        .sub-filter-btn.active {
            background: #D4A373;
            color: white;
        }
        .sub-filter-btn:hover:not(.active) {
            background: #F5EDDA;
        }

        /* Grid de atividades */
        .atividades-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }
        .atividade-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #F5EDDA;
            transition: all 0.3s;
        }
        .atividade-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .atividade-header {
            padding: 20px 24px;
            color: white;
        }
        .atividade-header.curricular {
            background: linear-gradient(135deg, #2B7A4B, #1E5A38);
        }
        .atividade-header.cultural {
            background: linear-gradient(135deg, #D4A373, #B5835A);
        }
        .atividade-header.ciencia {
            background: linear-gradient(135deg, #5C3A21, #7A5233);
        }
        .atividade-tipo {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .atividade-disciplina {
            font-size: 12px;
            margin-bottom: 5px;
            opacity: 0.9;
        }
        .atividade-header h3 {
            font-size: 18px;
            font-weight: 700;
        }
        .atividade-body {
            padding: 20px;
        }
        .atividade-pontos {
            display: inline-block;
            background: #FBF7E9;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            color: #2B7A4B;
            margin-bottom: 15px;
        }
        .requisitos-section {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .requisitos-title {
            font-size: 13px;
            font-weight: 700;
            color: #5C3A21;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .requisitos-lista {
            list-style: none;
            padding-left: 0;
        }
        .requisitos-lista li {
            font-size: 13px;
            color: #8B694C;
            padding: 6px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .requisitos-lista li i {
            color: #2B7A4B;
            font-size: 12px;
        }
        .atividade-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #F5EDDA;
            flex-wrap: wrap;
            gap: 10px;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .status-disponivel { background: #E9F5EF; color: #2B7A4B; }
        .status-em_andamento { background: #FFE4D6; color: #FF6B35; }
        .status-encerrada { background: #F5EDDA; color: #8B694C; }
        .info-text { font-size: 12px; color: #8B694C; display: flex; align-items: center; gap: 6px; }
        .sem-atividades { text-align: center; padding: 60px; background: white; border-radius: 20px; color: #8B694C; }

        @media (max-width: 768px) {
            .atividades-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; text-align: center; }
            .main-tabs { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon"><img src="{% static 'images/logo-caf.png' %}" alt="Logo"></div>
                <h1>Colégio Árvore da Felicidade</h1>
            </div>
            <div class="nav-links">
                <a href="{% url 'dashboard_aluno' %}" class="nav-link"><i class="fas fa-home"></i> Início</a>
                <a href="{% url 'atividades' %}" class="nav-link active"><i class="fas fa-calendar-alt"></i> Atividades</a>
                <a href="{% url 'loja' %}" class="nav-link"><i class="fas fa-store"></i> Loja</a>
                <a href="{% url 'historico' %}" class="nav-link"><i class="fas fa-history"></i> Histórico</a>
            </div>
            <div class="user-area">
                <div class="user-avatar"><i class="fas fa-user-graduate"></i></div>
                <div>
                    <div class="user-name">{{ nome }}</div>
                    <div class="user-info">PROC: {{ processo }} | {{ turma }}</div>
                </div>
                <div class="saldo-card"><i class="fas fa-star"></i> {{ saldo }} pts</div>
                <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sair</button>
            </div>
        </div>

        <!-- Abas principais -->
        <div class="main-tabs">
            <div class="main-tab active" data-tipo="curriculares">📚 Atividades Curriculares</div>
            <div class="main-tab" data-tipo="extra">🎭 Atividades Extra-Curriculares</div>
        </div>

        <!-- Sub-filtros para Curriculares (por disciplina) -->
        <div id="subFiltrosCurriculares" class="sub-filters">
            <button class="sub-filter-btn active" data-disciplina="todas">Todas as Disciplinas</button>
            {% for disciplina in disciplinas %}
            <button class="sub-filter-btn" data-disciplina="{{ disciplina.id }}">{{ disciplina.nome }}</button>
            {% endfor %}
        </div>

        <!-- Sub-filtros para Extra-Curriculares (por tipo) -->
        <div id="subFiltrosExtra" class="sub-filters" style="display: none;">
            <button class="sub-filter-btn active" data-extra-tipo="todos">Todos</button>
            <button class="sub-filter-btn" data-extra-tipo="cultural">🎨 Culturais</button>
            <button class="sub-filter-btn" data-extra-tipo="ciencia_tecnologia">🔬 Ciência e Tecnologia</button>
        </div>

        <!-- Grid de Atividades -->
        <div id="atividadesGrid" class="atividades-grid"></div>
    </div>

    <script>
        // Dados das atividades vindo do Django
        const atividadesCurriculares = [
            {% for atv in atividades_curriculares %}
            {
                id: {{ atv.id }},
                nome: "{{ atv.nome|escapejs }}",
                tipo: "curricular",
                disciplina_id: {{ atv.disciplina.id }},
                disciplina_nome: "{{ atv.disciplina.nome|escapejs }}",
                criterios: "{{ atv.criterios_avaliacao|escapejs }}",
                data_inicio: "{{ atv.data_inicio|date:'Y-m-d' }}",
                data_fim: "{{ atv.data_fim|date:'Y-m-d' }}",
                hora_inicio: "{{ atv.hora_inicio|time:'H:i' }}",
                hora_fim: "{{ atv.hora_fim|time:'H:i' }}",
                max_pontos: {{ atv.max_pontos_por_aluno }}
            },
            {% endfor %}
        ];

        const atividadesExtra = [
            {% for atv in atividades_extra %}
            {
                id: {{ atv.id }},
                nome: "{{ atv.nome|escapejs }}",
                tipo: "extra",
                extra_tipo: "{{ atv.tipo_atividade }}",
                extra_tipo_display: "{{ atv.get_tipo_atividade_display }}",
                criterios: "{{ atv.criterios_avaliacao|escapejs }}",
                data_inicio: "{{ atv.data_inicio|date:'Y-m-d' }}",
                data_fim: "{{ atv.data_fim|date:'Y-m-d' }}",
                hora_inicio: "{{ atv.hora_inicio|time:'H:i' }}",
                hora_fim: "{{ atv.hora_fim|time:'H:i' }}",
                max_pontos: {{ atv.max_pontos_por_aluno }}
            },
            {% endfor %}
        ];

        let tipoAtivo = 'curriculares';
        let disciplinaFiltro = 'todas';
        let extraTipoFiltro = 'todos';

        function getStatusClass(status) {
            const classes = {
                'disponivel': 'status-disponivel',
                'em_andamento': 'status-em_andamento',
                'encerrada': 'status-encerrada'
            };
            return classes[status] || 'status-disponivel';
        }

        function calcularStatus(dataFim, horaFim) {
            const agora = new Date();
            const hoje = agora.toISOString().split('T')[0];
            const horaAtual = agora.getHours() * 60 + agora.getMinutes();
            
            const [horaFimH, horaFimM] = horaFim.split(':').map(Number);
            const horaFimMinutos = horaFimH * 60 + horaFimM;
            
            if (dataFim < hoje) {
                return { status: 'encerrada', texto: 'Encerrada', icon: 'fa-clock' };
            } else if (dataFim === hoje && horaFimMinutos <= horaAtual) {
                return { status: 'encerrada', texto: 'Encerrada', icon: 'fa-clock' };
            } else {
                return { status: 'disponivel', texto: 'Disponível', icon: 'fa-calendar-check' };
            }
        }

        function formatarData(dataStr) {
            if (!dataStr) return '-';
            const data = new Date(dataStr);
            return data.toLocaleDateString('pt-BR');
        }

        function getHeaderClass(atividade) {
            if (atividade.tipo === 'curricular') return 'curricular';
            if (atividade.extra_tipo === 'cultural') return 'cultural';
            return 'ciencia';
        }

        function getTipoDisplay(atividade) {
            if (atividade.tipo === 'curricular') {
                return `<i class="fas fa-book"></i> ${atividade.disciplina_nome}`;
            }
            return atividade.extra_tipo_display;
        }

        function getCriteriosList(criterios) {
            if (!criterios) return ['Critérios não definidos'];
            return criterios.split('\n').filter(line => line.trim().length > 0);
        }

        function renderAtividades() {
            let atividades = [];
            
            if (tipoAtivo === 'curriculares') {
                atividades = [...atividadesCurriculares];
                if (disciplinaFiltro !== 'todas') {
                    atividades = atividades.filter(a => a.disciplina_id == disciplinaFiltro);
                }
            } else {
                atividades = [...atividadesExtra];
                if (extraTipoFiltro !== 'todos') {
                    atividades = atividades.filter(a => a.extra_tipo === extraTipoFiltro);
                }
            }
            
            const grid = document.getElementById('atividadesGrid');
            if (atividades.length === 0) {
                grid.innerHTML = `
                    <div class="sem-atividades">
                        <i class="fas fa-calendar-times" style="font-size: 48px; margin-bottom: 16px; color: #D4A373;"></i>
                        <h3>Nenhuma atividade encontrada</h3>
                        <p>Não há atividades disponíveis nesta categoria no momento.</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = atividades.map(a => {
                const statusInfo = calcularStatus(a.data_fim, a.hora_fim);
                const headerClass = getHeaderClass(a);
                const tipoDisplay = getTipoDisplay(a);
                const criteriosList = getCriteriosList(a.criterios);
                
                return `
                    <div class="atividade-card">
                        <div class="atividade-header ${headerClass}">
                            <div class="atividade-tipo">${tipoDisplay}</div>
                            <h3>${a.nome}</h3>
                        </div>
                        <div class="atividade-body">
                            <div class="requisitos-section">
                                <div class="requisitos-title">
                                    <i class="fas fa-clipboard-list"></i> Critérios de Avaliação
                                </div>
                                <ul class="requisitos-lista">
                                    ${criteriosList.map(c => `<li><i class="fas fa-check-circle"></i> ${c}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="atividade-pontos">
                                <i class="fas fa-star"></i> ${a.max_pontos} pontos
                            </div>
                            <div class="atividade-footer">
                                <span class="status-badge ${getStatusClass(statusInfo.status)}">
                                    <i class="fas ${statusInfo.icon}"></i> ${statusInfo.texto}
                                </span>
                                <span class="info-text">
                                    <i class="fas fa-calendar"></i> ${formatarData(a.data_inicio)} - ${formatarData(a.data_fim)}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Eventos das abas principais
        document.querySelectorAll('.main-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                tipoAtivo = tab.dataset.tipo;
                
                // Mostrar/esconder sub-filtros
                document.getElementById('subFiltrosCurriculares').style.display = tipoAtivo === 'curriculares' ? 'flex' : 'none';
                document.getElementById('subFiltrosExtra').style.display = tipoAtivo === 'extra' ? 'flex' : 'none';
                
                renderAtividades();
            });
        });

        // Eventos dos sub-filtros de curriculares
        document.querySelectorAll('#subFiltrosCurriculares .sub-filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#subFiltrosCurriculares .sub-filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                disciplinaFiltro = btn.dataset.disciplina;
                renderAtividades();
            });
        });

        // Eventos dos sub-filtros de extra
        document.querySelectorAll('#subFiltrosExtra .sub-filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#subFiltrosExtra .sub-filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                extraTipoFiltro = btn.dataset.extraTipo;
                renderAtividades();
            });
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            window.location.href = "{% url 'index' %}";
        });

        // Inicializar
        renderAtividades();
    </script>
</body>
</html>
