<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ turma.nome }} - Colégio Árvore da Felicidade</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/fundo.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #FBF7E9; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        .header {
            background: white;
            border-radius: 24px;
            padding: 15px 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #F5EDDA;
        }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 45px; height: 45px; background: #2B7A4B; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .logo-icon img { width: 28px; height: 28px; }
        .logo-area h1 { font-size: 18px; color: #5C3A21; font-weight: 700; }
        .back-link { background: #FBF7E9; border: none; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-size: 13px; color: #5C3A21; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .back-link:hover { background: #F5EDDA; }
        .user-area { display: flex; align-items: center; gap: 15px; background: #FBF7E9; padding: 6px 18px; border-radius: 40px; }
        .user-avatar { width: 38px; height: 38px; background: #2B7A4B; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; }
        .user-name { font-weight: 600; color: #5C3A21; font-size: 14px; }
        .logout-btn { background: none; border: 1px solid #F5EDDA; padding: 6px 14px; border-radius: 30px; cursor: pointer; }

        .turma-header {
            background: linear-gradient(135deg, #2B7A4B, #1E5A38);
            border-radius: 20px;
            padding: 25px 30px;
            margin-bottom: 25px;
            color: white;
        }
        .turma-header h2 { font-size: 28px; margin-bottom: 5px; }
        .turma-header p { opacity: 0.9; }

        .search-bar {
            background: white;
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border: 1px solid #F5EDDA;
        }
        .search-bar input { flex: 1; border: none; outline: none; padding: 8px 0; font-size: 14px; }
        .search-bar button { background: #2B7A4B; color: white; border: none; padding: 8px 20px; border-radius: 30px; cursor: pointer; }
        .search-bar button:last-child { background: #D4A373; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; }
        .card { background: white; border-radius: 20px; padding: 20px; border: 1px solid #F5EDDA; }
        .card-header { margin-bottom: 15px; padding-bottom: 12px; border-bottom: 2px solid #FBF7E9; display: flex; justify-content: space-between; align-items: center; }
        .card-header h3 { font-size: 18px; color: #5C3A21; }
        .btn-criar { background: #2B7A4B; color: white; border: none; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
        .btn-criar:hover { background: #1E5A38; }

        .aluno-item, .atividade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #F5EDDA;
            flex-wrap: wrap;
            gap: 10px;
        }
        .aluno-nome { font-weight: 600; color: #5C3A21; }
        .aluno-pontos { background: #E9F5EF; padding: 4px 10px; border-radius: 20px; font-size: 12px; color: #2B7A4B; }
        .btn-add { background: #D4A373; border: none; padding: 5px 12px; border-radius: 20px; color: white; cursor: pointer; font-size: 11px; }
        .btn-distribuir { background: #2B7A4B; border: none; padding: 5px 12px; border-radius: 20px; color: white; cursor: pointer; font-size: 11px; text-decoration: none; display: inline-block; }
        
        .atividade-nome { font-weight: 600; color: #5C3A21; }
        .atividade-data { font-size: 11px; color: #8B694C; margin-top: 3px; }
        .atividade-pontos { background: #E9F5EF; padding: 4px 10px; border-radius: 20px; font-size: 11px; color: #2B7A4B; }
        
        .form-pontos { background: #FBF7E9; border-radius: 16px; padding: 15px; margin-top: 15px; }
        .form-pontos input, .form-pontos textarea { width: 100%; padding: 10px; border: 1px solid #F5EDDA; border-radius: 12px; margin-bottom: 10px; }
        .form-pontos button { background: #2B7A4B; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; }

        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
        @media (max-width: 600px) { .header { flex-direction: column; text-align: center; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon"><img src="{% static 'images/logo-caf.png' %}" alt="Logo"></div>
                <h1>Colégio Árvore da Felicidade</h1>
            </div>
            <div>
                <a href="{% url 'dashboard_professor' %}" class="back-link"><i class="fas fa-arrow-left"></i> Voltar às Disciplinas</a>
            </div>
            <div class="user-area">
                <div class="user-avatar"><i class="fas fa-chalkboard-user"></i></div>
                <div><div class="user-name">{{ request.user.get_full_name|default:request.user.username }}</div></div>
                <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sair</button>
            </div>
        </div>

        <div class="turma-header">
            <h2><i class="fas fa-users"></i> {{ turma.nome }} - {{ turma.get_curso_display }}</h2>
            <p>Disciplina: <strong>{{ disciplina.nome }}</strong></p>
        </div>

        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Pesquisar aluno por nome ou processo...">
            <button id="searchBtn">Buscar</button>
            <button id="clearSearchBtn">Limpar</button>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-user-graduate"></i> Alunos</h3>
                </div>
                <div id="alunosList"></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-tasks"></i> Atividades</h3>
                    <a href="{% url 'criar_atividade' turma.id %}?disciplina_id={{ disciplina.id }}" class="btn-criar"><i class="fas fa-plus"></i> Criar Atividade</a>
                </div>
                <div id="atividadesList"></div>
            </div>
        </div>
    </div>

    <div id="infoModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(92,58,33,0.6); align-items:center; justify-content:center; z-index:1000;">
        <div style="background:white; border-radius:24px; padding:30px; max-width:350px; text-align:center;">
            <div style="width:60px; height:60px; background:#2B7A4B; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><i id="modalIcon" class="fas fa-check-circle" style="font-size:30px; color:white;"></i></div>
            <h3 id="modalTitle" style="color:#5C3A21;">Sucesso</h3>
            <p id="modalMessage" style="color:#8B694C;"></p>
            <button id="modalCloseBtn" style="background:#2B7A4B; color:white; border:none; padding:10px 20px; border-radius:30px; cursor:pointer;">Continuar</button>
        </div>
    </div>

    <script>
        const alunos = [
            {% for aluno in alunos %}
            { id: {{ aluno.id }}, nome: "{{ aluno.usuario.get_full_name|default:aluno.usuario.username }}", processo: "{{ aluno.numero_processo }}", pontos: {{ aluno.saldo_pontos }} },
            {% endfor %}
        ];
        
        const atividades = [
            {% for atv in atividades %}
            { id: {{ atv.id }}, nome: "{{ atv.nome }}", data_fim: "{{ atv.data_fim|date:'Y-m-d' }}", hora_fim: "{{ atv.hora_fim|time:'H:i' }}", max_pontos: {{ atv.max_pontos_por_aluno }} },
            {% endfor %}
        ];

        const hoje = new Date();
        const hojeStr = hoje.toISOString().split('T')[0];

        function showModal(title, message, isSuccess = true) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            const icon = document.querySelector('#infoModal .modal-icon');
            icon.style.background = isSuccess ? '#2B7A4B' : '#D4A373';
            document.getElementById('infoModal').style.display = 'flex';
        }

        function hideModal() { document.getElementById('infoModal').style.display = 'none'; }

        function renderAlunos(pesquisa = '') {
            const filtered = alunos.filter(a => 
                a.nome.toLowerCase().includes(pesquisa) || 
                a.processo.includes(pesquisa)
            );
            const container = document.getElementById('alunosList');
            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:20px;">Nenhum aluno encontrado</div>';
                return;
            }
            container.innerHTML = filtered.map(a => `
                <div class="aluno-item" data-id="${a.id}">
                    <div>
                        <div class="aluno-nome">${a.nome}</div>
                        <div class="aluno-processo" style="font-size:11px;color:#8B694C;">${a.processo}</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span class="aluno-pontos">${a.pontos} pts</span>
                        <button class="btn-add" onclick="mostrarFormulario(${a.id}, '${a.nome}')">+ Adicionar</button>
                    </div>
                </div>
            `).join('');
        }

        function renderAtividades() {
            const container = document.getElementById('atividadesList');
            if (atividades.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:20px;">Nenhuma atividade criada ainda.</div>';
                return;
            }
            container.innerHTML = atividades.map(a => {
                const podeDistribuir = a.data_fim < hojeStr;
                return `
                    <div class="atividade-item">
                        <div>
                            <div class="atividade-nome">📝 ${a.nome}</div>
                            <div class="atividade-data"><i class="fas fa-calendar"></i> até ${a.data_fim} | <i class="fas fa-clock"></i> ${a.hora_fim}</div>
                            <div><span class="atividade-pontos">Max: ${a.max_pontos} pts por aluno</span></div>
                        </div>
                        ${podeDistribuir ? `<a href="{% url 'distribuir_pontos' 0 %}?turma_id={{ turma.id }}".replace('0', a.id) class="btn-distribuir"><i class="fas fa-share-alt"></i> Distribuir Pontos</a>` : '<span style="font-size:11px;color:#A58E6F;"><i class="fas fa-hourglass-half"></i> Aguardando data de fim</span>'}
                    </div>
                `;
            }).join('');
        }

        window.mostrarFormulario = (id, nome) => {
            const existingForm = document.getElementById(`form-${id}`);
            if (existingForm) { existingForm.remove(); return; }
            
            const alunoDiv = document.querySelector(`.aluno-item[data-id="${id}"]`);
            const formHtml = `
                <div class="form-pontos" id="form-${id}">
                    <input type="number" id="pts-${id}" placeholder="Pontos" value="10" min="1" max="100">
                    <textarea id="mot-${id}" rows="2" placeholder="Motivo (ex: Participação, Trabalho, etc.)"></textarea>
                    <div>
                        <button onclick="confirmarAdd(${id}, '${nome}')">Confirmar</button>
                        <button onclick="document.getElementById('form-${id}').remove()">Cancelar</button>
                    </div>
                </div>
            `;
            alunoDiv.insertAdjacentHTML('afterend', formHtml);
        };

        window.confirmarAdd = (id, nome) => {
            const pontos = parseInt(document.getElementById(`pts-${id}`).value);
            const motivo = document.getElementById(`mot-${id}`).value || "Adição de pontos pelo professor";
            const aluno = alunos.find(a => a.id === id);
            if (aluno && pontos > 0) {
                aluno.pontos += pontos;
                renderAlunos(document.getElementById('searchInput').value.toLowerCase());
                showModal('Pontos Adicionados!', `${pontos} pontos adicionados a ${nome}. Motivo: ${motivo}`);
                document.getElementById(`form-${id}`)?.remove();
            } else {
                showModal('Erro', 'Insira uma quantidade válida de pontos.', false);
            }
        };

        document.getElementById('searchBtn').addEventListener('click', () => {
            renderAlunos(document.getElementById('searchInput').value.toLowerCase());
        });
        document.getElementById('clearSearchBtn').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            renderAlunos('');
        });
        document.getElementById('logoutBtn').addEventListener('click', () => window.location.href = "{% url 'index' %}");
        document.getElementById('modalCloseBtn').addEventListener('click', hideModal);
        
        renderAlunos('');
        renderAtividades();
    </script>
</body>
</html>
