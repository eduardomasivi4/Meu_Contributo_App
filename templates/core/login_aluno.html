<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colégio Árvore da Felicidade - Login Aluno</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/fundo.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; padding: 20px; min-height: 100vh; }
        .login-container { max-width: 450px; width: 100%; }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid #F5EDDA;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #8B694C;
            text-decoration: none;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .back-link:hover { color: #5C3A21; }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-logo { width: 70px; height: 70px; margin-bottom: 15px; }
        .login-header h2 { font-size: 28px; color: #5C3A21; margin-bottom: 8px; }
        .login-header p { color: #8B694C; font-size: 14px; }
        .aluno-nome {
            background: #FBF7E9;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            border-left: 4px solid #2B7A4B;
        }
        .aluno-nome span { font-size: 14px; color: #8B694C; }
        .aluno-nome strong { font-size: 18px; color: #5C3A21; display: block; margin-top: 5px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #5C3A21; font-size: 14px; }
        .form-group label i { margin-right: 8px; color: #D4A373; }
        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #A58E6F;
        }
        .input-field {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #F5EDDA;
            border-radius: 16px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }
        .input-field:focus { outline: none; border-color: #2B7A4B; }
        .btn-login {
            width: 100%;
            background: #2B7A4B;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .btn-login:hover { background: #1E5A38; transform: translateY(-2px); }
        .divider { text-align: center; margin: 25px 0; position: relative; }
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #F5EDDA;
        }
        .divider span {
            background: white;
            padding: 0 15px;
            position: relative;
            color: #A58E6F;
            font-size: 13px;
        }
        .link-professor { text-align: center; }
        .link-professor a { color: #D4A373; text-decoration: none; font-size: 14px; }
        .link-professor a:hover { color: #B5835A; text-decoration: underline; }
        .version-info {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #F5EDDA;
            font-size: 11px;
            color: #B8A17E;
        }
        .hidden { display: none; }
        .error-message {
            background: #FEF3C7;
            color: #B45309;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }
        @media (max-width: 500px) {
            .login-card { padding: 25px; }
            .login-header h2 { font-size: 24px; }
            .login-logo { width: 55px; height: 55px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Voltar ao início</a>
            
            <div class="login-header">
                <img src="{% static 'images/logo-caf.png' %}" class="login-logo">
                <h2>Acesso do Aluno</h2>
                <p id="stepDescription">Digite seu Número de Processo</p>
            </div>
            
            <div id="errorArea" class="hidden error-message"></div>
            
            <div id="alunoInfoArea" class="hidden aluno-nome">
                <span><i class="fas fa-user-graduate"></i> Bem-vindo(a)</span>
                <strong id="alunoNome"></strong>
            </div>
            
            <form id="loginForm"> {% csrf_token %}
                <div class="form-group" id="processoGroup">
                    <label><i class="fas fa-id-card"></i> Número de Processo</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="processoInput" placeholder="Ex: 20241005" class="input-field" required>
                    </div>
                </div>
                
                <div id="senhaGroup" class="hidden">
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Senha</label>
                        <div class="input-wrapper">
                            <i class="fas fa-key"></i>
                            <input type="password" id="senhaInput" placeholder="••••••••" class="input-field">
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn-login" id="btnLogin">
                    <i class="fas fa-arrow-right-to-bracket"></i> Verificar
                </button>
            </form>
            
            <div class="divider"><span>ou</span></div>
            
            <div class="link-professor">
                <a href="#" id="professorLink"><i class="fas fa-chalkboard-user"></i> Acessar área do professor</a>
            </div>
            
            <div class="version-info">
                <i class="fas fa-shield-alt"></i> VERSÃO 2.4.0 • SISTEMA INTEGRADO DE MÉRITO
            </div>
        </div>
    </div>
    
    <div id="infoModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(92,58,33,0.6); backdrop-filter:blur(4px); align-items:center; justify-content:center; z-index:1000;">
        <div style="background:white; border-radius:24px; padding:30px; max-width:350px; width:90%; text-align:center;">
            <div style="width:60px; height:60px; background:#2B7A4B; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;">
                <i id="modalIcon" class="fas fa-check-circle" style="font-size:30px; color:white;"></i>
            </div>
            <h3 id="modalTitle" style="color:#5C3A21; margin-bottom:10px;">Informação</h3>
            <p id="modalMessage" style="color:#8B694C; margin-bottom:20px;">Mensagem do sistema</p>
            <button id="modalCloseBtn" style="background:#2B7A4B; color:white; border:none; padding:10px 20px; border-radius:30px; cursor:pointer;">Continuar</button>
        </div>
    </div>
    
    <script>
        const processoInput = document.getElementById('processoInput');
        const senhaGroup = document.getElementById('senhaGroup');
        const alunoInfoArea = document.getElementById('alunoInfoArea');
        const alunoNome = document.getElementById('alunoNome');
        const btnLogin = document.getElementById('btnLogin');
        const stepDescription = document.getElementById('stepDescription');
        const errorArea = document.getElementById('errorArea');
        const professorLink = document.getElementById('professorLink');
        const modal = document.getElementById('infoModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalIcon = document.getElementById('modalIcon');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        
        let processoVerificado = false;
        let alunoAtual = null;
        
        function showModal(title, message, isSuccess = true) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modalIcon.parentElement.style.background = isSuccess ? '#2B7A4B' : '#D4A373';
            modalIcon.className = isSuccess ? 'fas fa-check-circle' : 'fas fa-exclamation-triangle';
            modal.style.display = 'flex';
        }
        
        function hideModal() { modal.style.display = 'none'; }
        
        function showError(message) {
            errorArea.textContent = message;
            errorArea.classList.remove('hidden');
            setTimeout(() => errorArea.classList.add('hidden'), 5000);
        }
        
        async function verificarProcesso(processo) {
            try {
                const response = await fetch('/api/aluno/verificar-processo/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                    body: JSON.stringify({ processo: processo })
                });
                return await response.json();
            } catch (error) {
                showError('Erro de conexão com o servidor.');
                return null;
            }
        }
        
        async function fazerLogin(processo, senha) {
            try {
                const response = await fetch('/api/aluno/validar-senha/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                    body: JSON.stringify({ processo: processo, senha: senha })
                });
                const data = await response.json();
                if (data.success) {
                    showModal('✅ Login realizado!', `Redirecionando para o dashboard...`);
                    setTimeout(() => window.location.href = data.redirect, 1500);
                } else {
                    showError(data.erro || 'Senha incorreta!');
                    document.getElementById('senhaInput').value = '';
                    document.getElementById('senhaInput').focus();
                }
            } catch (error) {
                showError('Erro de conexão com o servidor.');
            }
        }
        
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        btnLogin.addEventListener('click', async (e) => {
            e.preventDefault();
            const processo = processoInput.value.trim();
            
            if (!processoVerificado) {
                if (!processo) { showError('Por favor, digite o Número de Processo.'); return; }
                
                btnLogin.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Verificando...';
                btnLogin.disabled = true;
                const resultado = await verificarProcesso(processo);
                btnLogin.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Verificar';
                btnLogin.disabled = false;
                
                if (resultado && resultado.existe) {
                    alunoAtual = resultado;
                    processoVerificado = true;
                    alunoNome.textContent = resultado.nome;
                    alunoInfoArea.classList.remove('hidden');
                    senhaGroup.classList.remove('hidden');
                    errorArea.classList.add('hidden');
                    stepDescription.textContent = 'Digite sua senha para acessar';
                    btnLogin.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Entrar';
                    processoInput.disabled = true;
                    document.getElementById('senhaInput').focus();
                } else if (resultado && !resultado.existe) {
                    showError(resultado.erro || 'Número de processo não encontrado.');
                    processoInput.value = '';
                    processoInput.focus();
                }
            } else {
                const senha = document.getElementById('senhaInput').value;
                const processo = processoInput.value.trim();
                if (!senha) { showError('Por favor, digite sua senha.'); return; }
                
                btnLogin.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Entrando...';
                btnLogin.disabled = true;
                await fazerLogin(processo, senha);
                btnLogin.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Entrar';
                btnLogin.disabled = false;
            }
        });
        
        professorLink.addEventListener('click', (e) => { e.preventDefault(); window.location.href = '/professor/login/'; });
        modalCloseBtn.addEventListener('click', hideModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) hideModal(); });
        
        document.getElementById('senhaInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && processoVerificado) btnLogin.click();
        });
        processoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !processoVerificado) btnLogin.click();
        });
    </script>
</body>
</html>
