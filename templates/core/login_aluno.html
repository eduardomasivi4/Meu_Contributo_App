<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colégio Árvore da Felicidade - Login Aluno</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/fundo.css' %}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-container { max-width: 450px; width: 100%; }
    .login-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 32px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
    .back-link { display: inline-flex; align-items: center; gap: 8px; color: #8B694C; text-decoration: none; margin-bottom: 25px; }
    .back-link:hover { color: #5C3A21; }
    .login-header { text-align: center; margin-bottom: 30px; }
    .login-logo { width: 70px; height: 70px; margin-bottom: 15px; }
    .login-header h2 { font-size: 28px; color: #5C3A21; margin-bottom: 8px; }
    .login-header p { color: #8B694C; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #5C3A21; font-size: 14px; }
    .form-group label i { margin-right: 8px; color: #D4A373; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #A58E6F; }
    .input-field { width: 100%; padding: 14px 15px 14px 45px; border: 2px solid #F5EDDA; border-radius: 16px; font-size: 14px; transition: all 0.3s; }
    .input-field:focus { outline: none; border-color: #2B7A4B; }
    .forgot-pw { text-align: right; margin-top: 8px; }
    .forgot-pw a { font-size: 12px; color: #A58E6F; text-decoration: none; }
    .forgot-pw a:hover { color: #2B7A4B; }
    .btn-login { width: 100%; background: #2B7A4B; color: white; border: none; padding: 14px; border-radius: 40px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn-login:hover { background: #1E5A38; transform: translateY(-2px); }
    .divider { text-align: center; margin: 25px 0; position: relative; }
    .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #F5EDDA; }
    .divider span { background: white; padding: 0 15px; position: relative; color: #A58E6F; font-size: 13px; }
    .link-professor { text-align: center; }
    .link-professor a { color: #D4A373; text-decoration: none; font-size: 14px; }
    .link-professor a:hover { color: #B5835A; text-decoration: underline; }
    .version-info { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #F5EDDA; font-size: 11px; color: #B8A17E; }
    @media (max-width: 500px) { .login-card { padding: 25px; } .login-header h2 { font-size: 24px; } .login-logo { width: 55px; height: 55px; } }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Voltar ao início</a>
      <div class="login-header"><img src="{% static 'images/logo-caf.png' %}" class="login-logo"><h2>Acesso do Aluno</h2><p>Digite suas credenciais para entrar no sistema</p></div>
      <form id="loginForm">
        <div class="form-group"><label><i class="fas fa-id-card"></i> Número de Processo</label><div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="processoInput" placeholder="Ex: 20241005" class="input-field" required></div></div>
        <div class="form-group"><label><i class="fas fa-lock"></i> Senha Única</label><div class="input-wrapper"><i class="fas fa-key"></i><input type="password" id="senhaInput" placeholder="••••••••" class="input-field" required></div><div class="forgot-pw"><a href="#" id="forgotLink">Esqueci minha senha?</a></div></div>
        <button type="submit" class="btn-login" id="btnLogin"><i class="fas fa-arrow-right-to-bracket"></i> Entrar no Sistema</button>
      </form>
      <div class="divider"><span>ou</span></div>
      <div class="link-professor"><a href="#" id="professorLink"><i class="fas fa-chalkboard-user"></i> Acessar área do professor</a></div>
      <div class="version-info"><i class="fas fa-shield-alt"></i> VERSÃO 2.4.0 • SISTEMA INTEGRADO DE MÉRITO</div>
    </div>
  </div>
  <div id="infoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(92,58,33,0.6); align-items:center; justify-content:center; z-index:1000;"><div style="background:white; border-radius:24px; padding:30px; max-width:350px; text-align:center;"><div style="width:60px; height:60px; background:#2B7A4B; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><i id="modalIcon" class="fas fa-check-circle" style="font-size:30px; color:white;"></i></div><h3 id="modalTitle" style="color:#5C3A21;">Informação</h3><p id="modalMessage" style="color:#8B694C;">Mensagem</p><button id="modalCloseBtn" style="background:#2B7A4B; color:white; border:none; padding:10px 20px; border-radius:30px; cursor:pointer;">Continuar</button></div></div>
  <script>
    const btnLogin = document.getElementById('btnLogin'), forgotLink = document.getElementById('forgotLink'), professorLink = document.getElementById('professorLink'), modal = document.getElementById('infoModal'), modalTitle = document.getElementById('modalTitle'), modalMessage = document.getElementById('modalMessage'), modalIcon = document.getElementById('modalIcon'), modalCloseBtn = document.getElementById('modalCloseBtn');
    function showModal(title, msg, isSuccess=true) { modalTitle.textContent = title; modalMessage.textContent = msg; modal.style.display = 'flex'; if(isSuccess) { modalIcon.parentElement.style.background = '#2B7A4B'; modalIcon.className = 'fas fa-check-circle'; } else { modalIcon.parentElement.style.background = '#D4A373'; modalIcon.className = 'fas fa-exclamation-triangle'; } }
    function hideModal() { modal.style.display = 'none'; }
    btnLogin.addEventListener('click', (e) => { e.preventDefault(); const processo = document.getElementById('processoInput').value.trim(); const senha = document.getElementById('senhaInput').value; if(!processo || !senha) { showModal('⚠️ Atenção', 'Preencha Nº Processo e Senha.', false); return; } btnLogin.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Processando...'; btnLogin.disabled = true; setTimeout(() => { btnLogin.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Entrar no Sistema'; btnLogin.disabled = false; showModal('✅ Sucesso!', 'Login realizado!'); setTimeout(() => { window.location.href = '/aluno/dashboard/'; }, 1500); }, 1000); });
    forgotLink.addEventListener('click', (e) => { e.preventDefault(); showModal('🔐 Recuperar Senha', 'Entre em contato com a secretaria.', false); });
    professorLink.addEventListener('click', (e) => { e.preventDefault(); window.location.href = '/professor/login/'; });
    modalCloseBtn.addEventListener('click', hideModal);
  </script>
</body>
</html>
