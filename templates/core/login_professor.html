<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Professor - Colégio Árvore da Felicidade</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/fundo.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; padding: 20px; min-height: 100vh; }
        .login-container { max-width: 500px; width: 100%; }
        .login-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px;
            border: 1px solid #F5EDDA;
        }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #8B694C; text-decoration: none; margin-bottom: 25px; }
        .back-link:hover { color: #5C3A21; }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-logo { width: 70px; height: 70px; margin-bottom: 15px; }
        .login-header h2 { font-size: 28px; color: #5C3A21; margin-bottom: 8px; }
        .login-header p { color: #8B694C; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #5C3A21; }
        .form-group label i { margin-right: 8px; color: #D4A373; }
        .input-field {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #F5EDDA;
            border-radius: 16px;
            font-size: 14px;
            background: white;
            transition: all 0.3s;
        }
        .input-field:focus { outline: none; border-color: #2B7A4B; }
        .btn-login {
            width: 100%;
            background: #2B7A4B;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .btn-login:hover { background: #1E5A38; transform: translateY(-2px); }
        .divider { text-align: center; margin: 25px 0; position: relative; }
        .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #F5EDDA; }
        .divider span { background: white; padding: 0 15px; position: relative; color: #A58E6F; }
        .link-aluno { text-align: center; }
        .link-aluno a { color: #2B7A4B; text-decoration: none; }
        .link-aluno a:hover { text-decoration: underline; }
        .info-message {
            background: #FBF7E9;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 13px;
            color: #8B694C;
            margin: 16px 0;
            text-align: center;
        }
        @media (max-width: 500px) { .login-card { padding: 25px; } .login-header h2 { font-size: 24px; } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Voltar ao início</a>
            
            <div class="login-header">
                <img src="{% static 'images/logo-caf.png' %}" class="login-logo">
                <h2>Acesso do Professor</h2>
                <p>Digite suas credenciais para acessar o sistema</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> E-mail Institucional</label>
                    <input type="email" id="emailInput" class="input-field" placeholder="professor@colegioarvore.ao" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Senha</label>
                    <input type="password" id="senhaInput" class="input-field" placeholder="••••••••" required>
                </div>
                <div class="info-message" id="infoMessage">
                    <i class="fas fa-info-circle"></i> Insira seu e-mail e senha
                </div>
                <button type="submit" class="btn-login" id="btnLogin">
                    <i class="fas fa-arrow-right-to-bracket"></i> ENTRAR
                </button>
            </form>

            <div class="divider"><span>ou</span></div>
            <div class="link-aluno">
                <a href="/aluno/login/"><i class="fas fa-user-graduate"></i> Acessar área do aluno</a>
            </div>
        </div>
    </div>

    <div id="infoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(92,58,33,0.6); backdrop-filter:blur(4px); align-items:center; justify-content:center; z-index:1000;">
        <div style="background:white; border-radius:24px; padding:30px; max-width:350px; width:90%; text-align:center;">
            <div style="width:60px; height:60px; background:#2B7A4B; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;">
                <i id="modalIcon" class="fas fa-check-circle" style="font-size:30px; color:white;"></i>
            </div>
            <h3 id="modalTitle" style="color:#5C3A21; margin-bottom:10px;">Processando</h3>
            <p id="modalMessage" style="color:#8B694C; margin-bottom:20px;"></p>
            <button id="modalCloseBtn" style="background:#2B7A4B; color:white; border:none; padding:10px 20px; border-radius:30px; cursor:pointer;">Fechar</button>
        </div>
    </div>

    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function showModal(title, message, isSuccess = true) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            const iconDiv = document.querySelector('#infoModal > div > div');
            if (iconDiv) iconDiv.style.background = isSuccess ? '#2B7A4B' : '#D4A373';
            document.getElementById('infoModal').style.display = 'flex';
        }

        function hideModal() { document.getElementById('infoModal').style.display = 'none'; }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const senha = document.getElementById('senhaInput').value;
            
            if (!email || !senha) { showModal('Atenção', 'Preencha e-mail e senha.', false); return; }
            
            document.getElementById('btnLogin').disabled = true;
            document.getElementById('btnLogin').innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Processando...';
            
            try {
                const response = await fetch('/api/professor/verificar/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                    body: JSON.stringify({ email: email, senha: senha })
                });
                const data = await response.json();
                if (data.success) {
                    showModal('Sucesso', 'Redirecionando...');
                    setTimeout(() => window.location.href = data.redirect, 1000);
                } else {
                    showModal('Erro de Login', data.erro || 'Credenciais inválidas.', false);
                    document.getElementById('btnLogin').disabled = false;
                    document.getElementById('btnLogin').innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> ENTRAR';
                }
            } catch (error) {
                showModal('Erro de Conexão', 'Não foi possível conectar ao servidor.', false);
                document.getElementById('btnLogin').disabled = false;
                document.getElementById('btnLogin').innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> ENTRAR';
            }
        });

        document.getElementById('modalCloseBtn').addEventListener('click', hideModal);
        document.getElementById('infoModal').addEventListener('click', (e) => { if (e.target === document.getElementById('infoModal')) hideModal(); });
        
        document.getElementById('emailInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('loginForm').dispatchEvent(new Event('submit')); });
        document.getElementById('senhaInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('loginForm').dispatchEvent(new Event('submit')); });
    </script>
</body>
</html>
