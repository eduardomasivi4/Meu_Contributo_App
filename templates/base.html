<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Colégio Árvore da Felicidade{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/fundo.css' %}">
    
    {% block extra_css %}{% endblock %}
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #FBF7E9; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        .btn-primario {
            background: #2B7A4B; color: white; border: none; padding: 10px 24px;
            border-radius: 30px; cursor: pointer; text-decoration: none; display: inline-block;
            transition: all 0.3s;
        }
        .btn-primario:hover { background: #1E5A38; transform: translateY(-2px); }
        
        .btn-secundario {
            background: #D4A373; color: white; border: none; padding: 10px 24px;
            border-radius: 30px; cursor: pointer; text-decoration: none; display: inline-block;
            transition: all 0.3s;
        }
        .btn-secundario:hover { background: #B5835A; transform: translateY(-2px); }
        
        .btn-perigo {
            background: #D9534F; color: white; border: none; padding: 10px 24px;
            border-radius: 30px; cursor: pointer; text-decoration: none; display: inline-block;
            transition: all 0.3s;
        }
        .btn-perigo:hover { background: #C9302C; transform: translateY(-2px); }
        
        .cartao {
            background: white; border-radius: 20px; padding: 20px;
            border: 1px solid #F5EDDA; margin-bottom: 20px;
        }
        
        .cabecalho {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; flex-wrap: wrap; gap: 15px;
        }
        .cabecalho h2 { color: #5C3A21; font-size: 24px; }
        
        .btn-voltar {
            background: #FBF7E9; padding: 8px 16px; border-radius: 30px;
            text-decoration: none; color: #5C3A21; display: inline-flex;
            align-items: center; gap: 8px;
        }
        .btn-voltar:hover { background: #F5EDDA; }
        
        .form-grupo { margin-bottom: 20px; }
        .form-grupo label {
            display: block; margin-bottom: 8px; font-weight: 600; color: #5C3A21;
        }
        .form-grupo input, .form-grupo select, .form-grupo textarea {
            width: 100%; padding: 12px 16px; border: 2px solid #F5EDDA;
            border-radius: 16px; font-size: 14px; font-family: inherit;
        }
        .form-grupo input:focus, .form-grupo select:focus, .form-grupo textarea:focus {
            outline: none; border-color: #2B7A4B;
        }
        
        .ajuda-texto { display: block; margin-top: 5px; font-size: 12px; color: #8B694C; }
        
        .mensagem-sucesso {
            background: #E9F5EF; color: #2B7A4B; padding: 12px 20px;
            border-radius: 12px; margin-bottom: 20px; border-left: 4px solid #2B7A4B;
        }
        .mensagem-erro {
            background: #FEF3C7; color: #B45309; padding: 12px 20px;
            border-radius: 12px; margin-bottom: 20px; border-left: 4px solid #B45309;
        }
        
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(92, 58, 33, 0.6);
            backdrop-filter: blur(4px); align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-conteudo {
            background: white; border-radius: 24px; padding: 30px;
            max-width: 400px; width: 90%; text-align: center;
        }
        .modal-icon {
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 15px;
        }
        .modal-icon.sucesso { background: #2B7A4B; }
        .modal-icon.erro { background: #D9534F; }
        .modal-icon.aviso { background: #D4A373; }
        .modal-icon i { font-size: 30px; color: white; }
        .modal-title { color: #5C3A21; margin-bottom: 10px; font-size: 20px; }
        .modal-message { color: #8B694C; margin-bottom: 20px; }
        .modal-fechar {
            background: #2B7A4B; color: white; border: none;
            padding: 10px 20px; border-radius: 30px; cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .container { padding: 15px; }
            .cabecalho { flex-direction: column; text-align: center; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="mensagem-{% if message.tags == 'error' %}erro{% elif message.tags == 'success' %}sucesso{% else %}aviso{% endif %}">
                    <i class="fas {% if message.tags == 'error' %}fa-exclamation-triangle{% elif message.tags == 'success' %}fa-check-circle{% else %}fa-info-circle{% endif %}"></i>
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>
    
    <div id="globalModal" class="modal-overlay">
        <div class="modal-conteudo">
            <div id="modalIcon" class="modal-icon"><i id="modalIconI" class="fas fa-check-circle"></i></div>
            <h3 id="modalTitle" class="modal-title">Informação</h3>
            <p id="modalMessage" class="modal-message">Mensagem do sistema</p>
            <button id="modalCloseBtn" class="modal-fechar">Fechar</button>
        </div>
    </div>
    
    <script>
        function mostrarModal(title, message, tipo = 'sucesso') {
            const modal = document.getElementById('globalModal');
            const modalIcon = document.getElementById('modalIcon');
            const modalIconI = document.getElementById('modalIconI');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modalIcon.className = 'modal-icon';
            
            if (tipo === 'sucesso') {
                modalIcon.classList.add('sucesso');
                modalIconI.className = 'fas fa-check-circle';
            } else if (tipo === 'erro') {
                modalIcon.classList.add('erro');
                modalIconI.className = 'fas fa-exclamation-triangle';
            } else {
                modalIcon.classList.add('aviso');
                modalIconI.className = 'fas fa-info-circle';
            }
            
            modal.style.display = 'flex';
        }
        
        function fecharModal() {
            document.getElementById('globalModal').style.display = 'none';
        }
        
        document.getElementById('modalCloseBtn')?.addEventListener('click', fecharModal);
        document.getElementById('globalModal')?.addEventListener('click', function(e) {
            if (e.target === this) fecharModal();
        });
        
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
